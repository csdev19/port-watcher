[package]
name = "system-health"
version = "0.1.0"
edition = "2024"
description = "Sudoless macOS system health: sensors, pressure events, per-process attribution, and the chapay CLI"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "system_health"
path = "src/lib.rs"

[[bin]]
name = "chapay"
path = "src/bin/chapay.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
