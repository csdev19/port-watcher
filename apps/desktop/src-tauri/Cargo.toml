[package]
name = "port-watcher"
version = "0.2.0"
description = "Menu-bar app that shows which processes hold TCP ports open"
authors = ["Cristian Sotomayor"]
edition = "2021"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "port_watcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
listeners = "0.6"
sysinfo = "0.39"
thiserror = "2"
nix = { version = "0.29", features = ["signal", "user", "fs"] }
log = "0.4"
tauri-plugin-store = "2"
semver = "1"
tauri-plugin-autostart = "2"
# In-app updates (ADR 0007), driven from Rust only. 2.13.2 is the first
# release whose macOS install never deletes the installed app on failure.
tauri-plugin-updater = "2.13.3"
# Unpack the update archive for the Developer ID check (src/update/identity.rs).
flate2 = "1"
tar = "0.4"
tempfile = "3"
# System health sensors, pressure events and the chapay CLI (ADR 0009). Path dependency:
# there is no Cargo workspace.
system-health = { path = "../../../crates/system-health" }


[target.'cfg(target_os = "macos")'.dependencies]
# Turns the panel window into a non-activating NSPanel: the only kind of
# window macOS lets another app show over a full-screen Space.
tauri-nspanel = "2.1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

