# Git hooks. Docs: https://lefthook.dev — contract and migration notes:
# https://github.com/csdev19/general-knowledge/blob/main/monorepos/git-hooks-lefthook-playbook.md
# commit = fix what you commit · push = verify what you share (read-only, same as CI)
# commit-msg = reject what release-please cannot parse. Bypass once: LEFTHOOK=0 git <cmd>.
min_version: 2.0.0

pre-commit:
  jobs:
    - name: format
      glob: "*.{js,jsx,cjs,mjs,ts,tsx,cts,mts,json,jsonc,css,md,mdx}"
      run: bunx oxfmt --write {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{js,jsx,cjs,mjs,ts,tsx,cts,mts}"
      run: bunx oxlint {staged_files}

commit-msg:
  skip:
    - merge
    - rebase
  jobs:
    - name: conventional-commit
      run: |
        first="$(head -1 {1})"
        echo "$first" | grep -qE '^(fixup!|squash!|Merge |Revert )' && exit 0
        echo "$first" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9._/-]+\))?!?: .+' && exit 0
        echo "Commit message must follow Conventional Commits, e.g. 'feat(web): add recordings page'."
        echo "release-please derives versions and changelogs from these prefixes."
        exit 1

# Tier: local push. This hook is the per-PR check (docs/adr/0014-verify-release-candidates-not-every-pr.md):
# ordinary PRs get only a seconds-long lint/format run in the cloud, so `verify` here is what
# "green" means before a release candidate. Measured on the owner's M5 Pro (2026-11-05):
# verify 27 s cold, 4-5 s warm; verify:rust (Rust pushes only) 103 s cold, 4-10 s warm.
# Reopen: if warm `verify` exceeds a minute, move its slowest part to the candidate tier.
pre-push:
  parallel: true
  jobs:
    - name: verify
      run: bun run verify
    # `glob` filters the push files (what HEAD adds over its upstream, or over origin/HEAD
    # for a new branch), so a push that does not touch the Rust core skips cargo entirely.
    # Checked against lefthook 2.1.12: skipped on docs-only pushes, run on src-tauri pushes.
    - name: verify-rust
      glob: "apps/desktop/src-tauri/**"
      run: bun run verify:rust
