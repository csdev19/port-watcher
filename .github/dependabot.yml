# Keeps the SHA-pinned actions in .github/workflows current: Dependabot bumps
# both the SHA and its `# vX.Y.Z` comment. Grouped into one weekly PR.
#
# Also bumps the desktop app's Rust crates. The weekly `cargo audit` only
# reports known vulnerabilities; this is what actually moves the versions.
# Minor and patch bumps share one PR; a major bump gets its own, since it
# may need code changes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build
      include: scope
