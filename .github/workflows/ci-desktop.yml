name: Desktop CI

# The desktop app's own checks, path-filtered so they only run when the app or a
# shared package changes. Lint and formatting for the whole repo live in the
# universal PR Validation workflow.

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/ci-desktop.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The workspace packages this app uses (domain, application, i18n, tokens)
      # resolve from source, so no package build step is needed first.
      - name: Test
        working-directory: apps/desktop
        run: bun run test

      # `build` runs the type-check first, then electron-vite. It is the real
      # check that the workspace packages bundle correctly into the main process
      # — a type-check alone would not catch that.
      - name: Build
        working-directory: apps/desktop
        run: bun run build
