name: release-please

# Maintains one rolling "release PR" per app (desktop / web). Merging a release
# PR bumps that app's package.json, writes its CHANGELOG, creates the
# component-prefixed tag (desktop-v* / web-v*) and a GitHub Release — which in
# turn triggers release-desktop.yml / release-web.yml. See
# docs/adr/0003-release-please-and-desktop-distribution.md.
#
# Token note: the tag MUST be created by a non-default token, otherwise the
# `on: push: tags` workflows won't fire (GitHub suppresses events raised by the
# default GITHUB_TOKEN). RELEASE_PLEASE_TOKEN is a fine-grained PAT with
# Contents + Pull requests read/write. The PAT also matters for pr-checks.yml: a PR
# opened or force-pushed with the default GITHUB_TOKEN would start no workflow, so the
# release PR could never be verified.

# Tier: bot. The release PR is opened as a DRAFT (`draft-pull-request` in
# release-please-config.json), so its rewrites start no verification; marking it Ready
# for review runs the full candidate checks in pr-checks.yml. Policy:
# docs/adr/0014-verify-release-candidates-not-every-pr.md, applying
# https://github.com/csdev19/general-knowledge/blob/main/monorepos/release-gated-verification.md
#
# Path-filtered (hub rule R6): a push to main that touches none of these paths cannot
# change a release PR, yet would bill a full minute. Skipping a run is safe:
# release-please reads the whole history on every run, so the next matching push picks
# up what a skipped one did not see, and merging a release PR always touches the app's
# package.json, so the tag is never skipped. `workflow_dispatch` is the manual catch-up.
# Reopen when a new releasable component is added: add its path here.

on:
  push:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "apps/fullstack-fn-only/**"
      - "packages/**"
      - "bun.lock"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - ".github/workflows/release-please.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # RELEASE_PLEASE_TOKEN lives in the `production` environment, with every
    # other secret. A job only sees an environment's secrets when it declares
    # that environment; `production` is restricted to `main` and the release
    # tags, and this job runs on `main`, so it is not gated.
    environment: production
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
