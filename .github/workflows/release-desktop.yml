name: Release Desktop

# Builds the chapay Tauri app for macOS (arm64 + x64), signs it with the
# Developer ID certificate and notarizes it, uploads the DMGs to Cloudflare R2
# and attaches them to the GitHub Release. See
# docs/adr/0003-release-please-and-desktop-distribution.md.
#
# Trigger: a `desktop-v*` tag, created by release-please when the desktop
# release PR is merged — or run manually from the Actions tab on `main` while
# tuning the pipeline (manual runs build, sign and notarize but publish
# nothing). A manual run on any other branch is skipped: the signing job must
# only ever run code that is already on `main`.
#
# Order matters for the signing secrets. Everything that executes third-party
# code (bun install, the Vite build, crate build scripts) runs first, with no
# certificate and no API key on the machine. Only then is the certificate
# imported and the .p8 written, and `tauri bundle` (no compilation) signs and
# notarizes. Both are removed right after.
#
# Secrets and variables live in the `production` GitHub Environment (hence
# `environment:`). Names match my-pets and the other desktop repos so the same
# values can be reused (ADR 0004). Secrets:
#   CSC_LINK              base64 of the Developer ID Application .p12
#   CSC_KEY_PASSWORD      password set when the .p12 was exported
#   APPLE_API_KEY         the App Store Connect .p8 (raw contents or base64)
#   APPLE_API_KEY_ID      the key id (10 chars)
#   APPLE_API_ISSUER      the Issuer ID (UUID)
#   R2_ACCESS_KEY_ID      R2 S3 API key (R2 → Manage R2 API Tokens)
#   R2_SECRET_ACCESS_KEY  its secret
#   CLOUDFLARE_ACCOUNT_ID the account that owns the bucket
# Variables (not sensitive, so `vars.`, readable in the Actions UI):
#   R2_BUCKET             bucket name
#   DOWNLOAD_BASE_URL     the bucket's public URL, no trailing slash
#                         (`https://pub-<id>.r2.dev` or a custom domain)

on:
  push:
    tags:
      - "desktop-v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release halfway: a cancelled run can stop between
  # notarization and upload, or between the versioned and `latest/` uploads.
  cancel-in-progress: false

permissions:
  contents: write # upload assets to the GitHub Release

jobs:
  release-mac:
    name: Build, sign & notarize (macOS)
    # Tag pushes always run; manual runs only from `main`.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 60
    environment: production
    env:
      # Neither is sensitive, so both are environment *variables* (same names
      # as my-pets). The web release bakes DOWNLOAD_BASE_URL into the landing's
      # download button, so the two workflows can never disagree about the
      # host. Job level, not workflow level: environment-scoped variables only
      # resolve inside a job that declares the environment.
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      DOWNLOAD_BASE_URL: ${{ vars.DOWNLOAD_BASE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4

      - name: Install the pinned Rust toolchain (both macOS targets)
        # Version and components come from src-tauri/rust-toolchain.toml.
        working-directory: apps/desktop/src-tauri
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared packages
        run: bun run build --filter='@port-watcher/*'

      - name: Build (unsigned, no secrets on the machine)
        working-directory: apps/desktop
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            bun run tauri build --target "$target" --no-bundle
          done

      - name: Import Developer ID certificate
        # Import the .p12 into a throwaway keychain ourselves and hand Tauri the
        # resolved identity, instead of relying on the bundler to guess it.
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Locks again after 30 min idle; signing happens within minutes of
          # the import, and the keychain is deleted right after bundling.
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Splitting is intended: each existing keychain is its own argument.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -o '"Developer ID Application: [^"]*"' | head -n 1 | tr -d '"')"
          test -n "$IDENTITY" || {
            echo "::error::No 'Developer ID Application' identity in CSC_LINK"
            exit 1
          }
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Prepare Apple API key file
        # Tauri's notarization wants the .p8 as a file path. Accept either the
        # raw .p8 contents or its base64 (whichever was stored in the secret).
        env:
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/apple_api_key.p8"
          umask 077
          if printf '%s' "$APPLE_API_KEY_SECRET" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$APPLE_API_KEY_SECRET" > "$KEY_PATH"
          else
            printf '%s' "$APPLE_API_KEY_SECRET" | base64 --decode > "$KEY_PATH"
          fi
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Sign, notarize & package DMGs
        # `tauri bundle` packages the binaries built above; it compiles
        # nothing and runs no build scripts.
        working-directory: apps/desktop
        env:
          # Tauri notarizes when these are set; APPLE_SIGNING_IDENTITY and
          # APPLE_API_KEY_PATH come from GITHUB_ENV (steps above).
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            bun run tauri bundle --target "$target" --bundles dmg
          done

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/apple_api_key.p8" "$RUNNER_TEMP/certificate.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Collect DMGs
        # Tauri names them chapay_<version>_<aarch64|x64>.dmg under each
        # target's bundle dir; copy them to one folder with stable arch names.
        run: |
          OUT="$RUNNER_TEMP/dist"
          mkdir -p "$OUT"
          BUNDLE=apps/desktop/src-tauri/target
          # Same source Tauri reads the version from (tauri.conf.json points
          # at package.json), so the name can never drift from the build.
          VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          # Exact names, not a glob: the Rust cache can restore a previous
          # release's DMG next to the new one.
          cp "$BUNDLE/aarch64-apple-darwin/release/bundle/dmg/chapay_${VERSION}_aarch64.dmg" "$OUT/chapay-${VERSION}-arm64.dmg"
          cp "$BUNDLE/x86_64-apple-darwin/release/bundle/dmg/chapay_${VERSION}_x64.dmg" "$OUT/chapay-${VERSION}-x64.dmg"
          ls -la "$OUT"
          echo "DIST=$OUT" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify signature and notarization
        # Gatekeeper's own checks, on the app inside each DMG exactly as a
        # user receives it: valid Developer ID signature, accepted by
        # Gatekeeper, notarization ticket stapled.
        run: |
          for arch in arm64 x64; do
            DMG="$DIST/chapay-${VERSION}-${arch}.dmg"
            MOUNT="$RUNNER_TEMP/mnt-${arch}"
            hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT" >/dev/null
            APP="$MOUNT/chapay.app"
            codesign --verify --deep --strict --verbose=2 "$APP"
            spctl --assess --type execute --verbose=2 "$APP"
            xcrun stapler validate "$APP"
            hdiutil detach "$MOUNT" >/dev/null
          done

      - name: Write checksums
        # SHA256SUMS next to the DMGs: one with the GitHub Release asset
        # names, one with the R2 names (same bytes, same hashes).
        run: |
          cd "$DIST"
          shasum -a 256 "chapay-${VERSION}-arm64.dmg" "chapay-${VERSION}-x64.dmg" > SHA256SUMS
          sed "s/chapay-${VERSION}-/chapay-/" SHA256SUMS > "$RUNNER_TEMP/SHA256SUMS.r2"
          cat SHA256SUMS "$RUNNER_TEMP/SHA256SUMS.r2"

      - name: Publish installers to R2 (versioned)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          # R2's S3 API needs its own Access Key + Secret — the Cloudflare API
          # token does NOT work here.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${R2_BUCKET:?Set the R2_BUCKET variable in the production environment}"
          : "${R2_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID secret in the production environment}"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Versioned objects never change, so browsers and Cloudflare's cache
          # may keep them for a year.
          IMMUTABLE="public, max-age=31536000, immutable"
          for arch in arm64 x64; do
            aws s3 cp "$DIST/chapay-${VERSION}-${arch}.dmg" "s3://${R2_BUCKET}/download/${VERSION}/chapay-${arch}.dmg" \
              --endpoint-url "$ENDPOINT" --content-type "application/x-apple-diskimage" --cache-control "$IMMUTABLE"
          done
          aws s3 cp "$RUNNER_TEMP/SHA256SUMS.r2" "s3://${R2_BUCKET}/download/${VERSION}/SHA256SUMS" \
            --endpoint-url "$ENDPOINT" --content-type "text/plain; charset=utf-8" --cache-control "$IMMUTABLE"

      - name: Verify versioned URLs
        # Check the new version answers publicly *before* `latest/` points at
        # it: a bucket without public access or a wrong DOWNLOAD_BASE_URL fails
        # here, while `latest/` still serves the previous release.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          : "${DOWNLOAD_BASE_URL:?Set the DOWNLOAD_BASE_URL variable in the production environment}"
          for path in "download/${VERSION}/chapay-arm64.dmg" "download/${VERSION}/chapay-x64.dmg" \
                      "download/${VERSION}/SHA256SUMS"; do
            curl -fsSIL "$DOWNLOAD_BASE_URL/$path" >/dev/null || { echo "::error::Missing: $DOWNLOAD_BASE_URL/$path"; exit 1; }
            echo "OK: $DOWNLOAD_BASE_URL/$path"
          done

      - name: Publish installers to R2 (latest)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${R2_BUCKET:?Set the R2_BUCKET variable in the production environment}"
          : "${R2_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID secret in the production environment}"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # `latest/` is the live alias the landing links to, so it must be
          # revalidated on every request.
          LIVE="public, max-age=0, must-revalidate"
          for arch in arm64 x64; do
            aws s3 cp "$DIST/chapay-${VERSION}-${arch}.dmg" "s3://${R2_BUCKET}/download/latest/chapay-${arch}.dmg" \
              --endpoint-url "$ENDPOINT" --content-type "application/x-apple-diskimage" --cache-control "$LIVE"
          done
          aws s3 cp "$RUNNER_TEMP/SHA256SUMS.r2" "s3://${R2_BUCKET}/download/latest/SHA256SUMS" \
            --endpoint-url "$ENDPOINT" --content-type "text/plain; charset=utf-8" --cache-control "$LIVE"

      - name: Verify latest URLs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for path in "download/latest/chapay-arm64.dmg" "download/latest/chapay-x64.dmg" \
                      "download/latest/SHA256SUMS"; do
            curl -fsSIL "$DOWNLOAD_BASE_URL/$path" >/dev/null || { echo "::error::Missing: $DOWNLOAD_BASE_URL/$path"; exit 1; }
            echo "OK: $DOWNLOAD_BASE_URL/$path"
          done

      - name: Prune old release artifacts (keep last N versions)
        # download/<version>/ accumulates one folder per release forever
        # otherwise (only download/latest/ self-overwrites). Older versions only
        # enable manual rollback, so a handful is enough.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEEP_VERSIONS: 3
        run: |
          # An empty bucket name would turn every path below into a bucket
          # root; refuse to run rather than prune the wrong place.
          : "${R2_BUCKET:?Set the R2_BUCKET variable in the production environment}"
          : "${R2_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID secret in the production environment}"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          VERSIONS=$(aws s3 ls "s3://${R2_BUCKET}/download/" --endpoint-url "$ENDPOINT" \
            | awk '{print $2}' | sed 's#/$##' | grep -v '^latest$' | grep -v '^$' | sort -V || true)
          TOTAL=0
          if [ -n "$VERSIONS" ]; then
            TOTAL=$(echo "$VERSIONS" | wc -l | tr -d ' ')
          fi
          STALE=$((TOTAL - KEEP_VERSIONS))
          if [ "$STALE" -gt 0 ]; then
            echo "$VERSIONS" | head -n "$STALE" | while read -r v; do
              [ -z "$v" ] && continue
              echo "Pruning download/${v}/ (keeping last ${KEEP_VERSIONS} versions)"
              aws s3 rm "s3://${R2_BUCKET}/download/${v}/" --recursive --endpoint-url "$ENDPOINT"
            done
          else
            echo "${TOTAL} version(s) published, nothing to prune (keeping last ${KEEP_VERSIONS})."
          fi

      - name: Upload build as workflow artifact
        # Only for manual runs (no tag): a tag release already ships the DMGs to
        # R2 and the GitHub Release, so this would be a redundant copy.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chapay-macos
          path: |
            ${{ env.DIST }}/*.dmg
            ${{ env.DIST }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 3

      - name: Attach DMGs to the GitHub Release
        # release-please owns the GitHub Release (it creates it, with the
        # changelog, before this tag exists). This step only adds assets; it
        # never changes the release's draft or prerelease state.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            "$DIST/chapay-${VERSION}-arm64.dmg" "$DIST/chapay-${VERSION}-x64.dmg" "$DIST/SHA256SUMS"
