name: Desktop CI

# Runs the Rust core of the Tauri app (apps/desktop/src-tauri) on macOS: the
# kill guards in ports/kill.rs and ports/classify.rs, and everything else
# `cargo test` covers. pr-validation.yml only runs the TypeScript side.
#
# Path-filtered, so a PR that does not touch the desktop app skips it. If you
# make this check required in branch protection, note that a skipped workflow
# never reports, which blocks PRs that do not touch these paths.

on:
  pull_request:
    branches:
      - main
      # Temporary: chapay v2 phase PRs target the integration branch (#55). Remove once it merges.
      - feat/chapay-v2
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        # Reads src-tauri/rust-toolchain.toml (version, rustfmt, clippy).
        # rustup ships with the macOS runner image.
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4

      - name: Build the renderer
        # tauri::generate_context! embeds ../dist at compile time, so the
        # crate does not compile (or test) without it.
        working-directory: .
        run: |
          bun install --frozen-lockfile
          bun run --cwd apps/desktop build

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked
