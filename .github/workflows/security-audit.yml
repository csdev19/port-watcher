name: Security audit

# Tier: scheduled, and candidate (reusable). Checks the dependency trees against
# the RustSec and npm advisory databases: weekly (new advisories land on
# unchanged lockfiles), on release-please PRs once marked Ready for review
# (called by pr-checks.yml), and by hand. It no longer runs on lockfile PRs:
# a lockfile change reaches users only through a release PR, which runs it.
# Policy: docs/adr/0014-verify-release-candidates-not-every-pr.md, applying
# https://github.com/csdev19/general-knowledge/blob/main/monorepos/release-gated-verification.md
#
# cargo audit fails the run (and its caller) on a vulnerability
# (unmaintained/unsound crates are warnings only). bun audit is report-only
# for now: the tree carries a backlog of advisories, mostly in dev tooling
# (vite, vitest, ws). Drop `continue-on-error` once that backlog is cleared.
#
# Reopen when a second person merges or branch protection is turned on (then
# lockfile PRs get this check again), or when the bun backlog is cleared.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit (desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit Cargo.lock
        run: cargo audit

  bun-audit:
    name: bun audit (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Audit bun.lock
        continue-on-error: true
        run: bun audit
