name: PR Validation

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bunx oxfmt --check .

      - name: Build packages
        run: bun run build --filter='@port-watcher/*'

      - name: Type check
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Build app
        working-directory: apps/fullstack-fn-only
        # The build reads no auth or database variables while both are disabled
        # (apps/fullstack-fn-only/vite.config.ts). Restore these placeholders
        # with them.
        # env:
        #   DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        #   BETTER_AUTH_SECRET: placeholder-secret-for-build-validation
        run: bun run build
