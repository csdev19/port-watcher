name: Release Web

# Builds and deploys the fullstack web Worker to port-watcher.cs19.dev (the
# custom domain is declared in apps/fullstack-fn-only/wrangler.jsonc).
#
# Trigger: a `web-v*` tag, created by release-please when its web release PR is
# merged — or run manually from the Actions tab.
#
# `production` environment:
#   secrets   CLOUDFLARE_API_TOKEN (Workers Scripts: Edit + Zone DNS: Edit on
#             cs19.dev, so wrangler can create the custom-domain record),
#             CLOUDFLARE_ACCOUNT_ID, DATABASE_URL, BETTER_AUTH_SECRET,
#             BETTER_AUTH_URL (= https://port-watcher.cs19.dev)
#   variables DOWNLOAD_BASE_URL (public R2 URL, shared with release-desktop.yml)

on:
  push:
    tags:
      - "web-v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pinned, not `latest`: a release must not change tools between two runs
      # of the same tag, and `deploy --secrets-file` below needs wrangler 4.x.
      # wrangler-action finds this binary and uses it as is.
      - name: Install Wrangler
        run: bun add -g wrangler@4.148.0

      - name: Build packages only
        run: bun run build --filter='@port-watcher/*'

      - name: Build app
        working-directory: apps/fullstack-fn-only
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          # Baked into the landing's download button at build time (Vite
          # inlines VITE_* vars). Same variable the desktop release publishes
          # to, so the button can only ever point where the DMGs land.
          VITE_PUBLIC_DOWNLOAD_URL: ${{ vars.DOWNLOAD_BASE_URL }}
        run: bun run build

      # Secrets ship INSIDE the deployed version, in one `wrangler deploy`. The
      # action's `secrets:` input runs `wrangler secret bulk` first, which edits
      # the latest version and deploys it on its own: never atomic, and refused
      # by Cloudflare once a version has been uploaded without being deployed.
      # `--secrets-file` is additive: a secret left out of the file keeps its
      # value, so empty values are dropped rather than blanking the Worker's.
      # Hub: monorepos/worker-secrets-with-deploy.md.
      - name: Write Worker secrets file
        working-directory: apps/fullstack-fn-only
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
        run: |
          umask 077
          jq -n \
            --arg DATABASE_URL "$DATABASE_URL" \
            --arg BETTER_AUTH_SECRET "$BETTER_AUTH_SECRET" \
            --arg BETTER_AUTH_URL "$BETTER_AUTH_URL" \
            '$ARGS.named | with_entries(select(.value != ""))' > worker-secrets.json

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/fullstack-fn-only
          command: deploy --secrets-file worker-secrets.json

      - name: Remove Worker secrets file
        if: always()
        run: rm -f apps/fullstack-fn-only/worker-secrets.json
