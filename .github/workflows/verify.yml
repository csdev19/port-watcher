name: Verify

# Tier: candidate and release (reusable). Runs `bun run verify` — the one definition of
# "verified" that the pre-push hook also runs (lint, oxfmt --check, package builds,
# check-types, test) — then the web app build, on a clean Linux runner.
#
# Callers: pr-checks.yml (release-please PRs once marked Ready for review, and manual
# dispatch), release-web.yml and release-desktop.yml (in front of every publish step).
# Run it by hand from the Actions tab after a risky merge (lockfile, workflows, build config).
# Policy: docs/adr/0014-verify-release-candidates-not-every-pr.md, applying
# https://github.com/csdev19/general-knowledge/blob/main/monorepos/release-gated-verification.md
#
# No workflow-level `concurrency`: in a called workflow it would be evaluated in the
# caller's context and could cancel a release's gate. The callers own cancellation.
#
# Reopen when a second person merges or branch protection is turned on: then this runs on
# every non-draft PR as a required check (see the ADR).

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (lint, types, tests, web build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      - name: Build app
        working-directory: apps/fullstack-fn-only
        # The build reads no auth or database variables while both are disabled
        # (apps/fullstack-fn-only/vite.config.ts). Restore these placeholders
        # with them.
        # env:
        #   DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        #   BETTER_AUTH_SECRET: placeholder-secret-for-build-validation
        run: bun run build
