name: Customizer Test

# Only runs when the customizer (or the template wiring it edits) changes — the
# rest of the time it costs nothing. The template's normal PR validation does
# not exercise the customizer at all.
on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/customize.ts"
      - "scripts/rename.ts"
      - "scripts/customize.test.ts"
      - "packages/infra-env/**"
      - "package.json"
      - ".github/workflows/customizer-test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  structure:
    name: Structural (all patterns, no install)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Structural tests
        run: bun test scripts/customize.test.ts

  build:
    name: Core build (${{ matrix.pattern }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every pattern must build core-only (mobile + docs dropped). The
        # client-server patterns rely on the customizer stripping the Expo auth
        # plugin from their server app when mobile is dropped (otherwise
        # @better-auth/expo@catalog fails to resolve).
        pattern:
          - client-server-hono
          - client-server-elysia
          - server-only-hono
          - fullstack-fn-only
          - fullstack-fn-and-convex
          - desktop-local-first
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      # Runs the customizer for real (install + build + check-types). It exits
      # non-zero if any of those fail. `--no-mobile --no-docs` drops the Expo and
      # Astro installs so this stays about the core stack — mobile/docs pruning is
      # already covered by the structural job.
      # `--desktop` is only meaningful for the desktop pattern (where it is forced
      # on anyway); the other patterns build their core stack without it.
      - name: Customize + build core (${{ matrix.pattern }})
        run: bun scripts/customize.ts --pattern ${{ matrix.pattern }} --no-mobile --no-docs --name testcore --yes
